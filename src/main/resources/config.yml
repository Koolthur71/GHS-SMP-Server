# GHSGuns config
# Damage is in half-hearts (2.0 = one heart).

# Players can never be killed by guns. Lethal hits leave them at this much health.
min-health: 1.0

# Troll extras
troll:
  # Launch players into the air when hit by an RPG or nuke blast
  launch-players: true
  # Firework confetti when a bullet hits a player
  confetti-on-hit: true
  # Broadcast a warning to the whole server when a nuke is fired
  nuke-broadcast: true

# Gun cooldowns between shots. Off = fire as fast as you can click (each gun's cooldown-ticks is ignored).
gun-cooldowns: false
# Never run out of ammo (no reloading at all). Careful with the nuke, lots of nukes = lots of lag.
infinite-ammo: false

# Explosions break blocks when true
explosions-break-blocks: true
# Explosions set fire when true
explosions-set-fire: false

# /guns undo restores blocks broken by gun explosions.
# History is kept in memory only, so it is cleared when the server restarts.
undo:
  max-history: 50

# Run as console when a player gets launched, so your anticheat (VoidAC) doesn't flag them.
# Use %player% for the player's name. Leave empty to disable.
# Check VoidAC's docs for its exempt command, or give players a bypass permission instead.
anticheat-exempt-command: ""

# The nuke: a core blast plus rings of explosions rolling outwards.
# Bigger numbers = bigger crater, but also more lag. Each ring adds 4 more explosions than the last.
nuke:
  rings: 3
  ring-spacing: 10
  ring-power: 7.0
  shockwave-radius: 80
  # Fake blocks that fly out of the crater and vanish when they land
  debris: 60

# The Tsar Bomba: the same idea as the nuke, just way bigger. Expect lag.
tsar-bomba:
  rings: 4
  ring-spacing: 12
  ring-power: 7.5
  shockwave-radius: 150
  debris: 120
  cloud-height: 85
  cloud-radius: 35

cluster-nuke:
  bomblets: 14
  bomblet-power: 4.0

