name: GHSGuns
version: '${project.version}'
main: com.ghs.guns.GHSGuns
api-version: '26.3'
description: Troll guns, RPGs and nukes that work for Java and Bedrock (Geyser) players.
commands:
  guns:
    description: Give guns or reload the config
    usage: /guns <give|undo|list|reload>
    permission: ghsguns.admin
permissions:
  ghsguns.admin:
    description: Use /guns
    default: op
  ghsguns.use:
    description: Fire guns
    default: true
